[package]
name = "codex-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "codex_proxy"
path = "src/lib.rs"

[[bin]]
name = "codex-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tempfile = "3"
