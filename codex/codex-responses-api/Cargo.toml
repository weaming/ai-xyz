[package]
name = "codex-responses-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "codex_responses_api"
path = "src/lib.rs"

[[bin]]
name = "codex-responses-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tiny_http = "0.12"
url = "2"

[dev-dependencies]
tempfile = "3"
