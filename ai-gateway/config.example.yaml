server:
  address: 127.0.0.1:8787
  read_timeout: 30s
  write_timeout: 30m
  idle_timeout: 2m
  shutdown_timeout: 10s

routes:
  - id: codex
    auth:
      token: ${AI_GATEWAY_TOKEN}
    upstream:
      provider: openai
      protocol: responses
      base_url: https://api.openai.com/v1
      token_env: OPENAI_API_KEY
      proxy: http://localhost:7890
      timeout: 30m
    defaults:
      model: gpt-5.6-luna
    conversion:
      mode: preserve
      emit_reasoning_content: true
